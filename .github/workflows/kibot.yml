name: KiBot ERC/DRC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kibot:
    name: ERC/DRC + exports (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - base-controller
          - hand-minute
          - hand-hour
    steps:
      - uses: actions/checkout@v4

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k9
        with:
          config: kibot.yml
          dir: kibot_out/${{ matrix.board }}
          schema: hardware/${{ matrix.board }}/${{ matrix.board }}.kicad_sch
          board: hardware/${{ matrix.board }}/${{ matrix.board }}.kicad_pcb
          verbose: '1'

      - name: Upload KiBot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kibot-${{ matrix.board }}
          path: kibot_out/${{ matrix.board }}
          if-no-files-found: warn
